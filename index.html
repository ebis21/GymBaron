<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#12141a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/assets/icon-192.png" />
    <link rel="apple-touch-icon" href="/assets/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>GYMBARON</title>
    <meta name="description" content="Symulator prowadzenia siłowni. Pusta sala, 500 kr i jeden klient w drzwiach." />

    <!--
      Absolute URLs on purpose: scrapers fetch these out of context and a
      relative path resolves against whatever host they happened to crawl.
      The domain is still the original one — renaming the Vercel project is a
      dashboard job, not a repo change.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GYMBARON" />
    <meta property="og:title" content="GYMBARON" />
    <meta property="og:description" content="Symulator prowadzenia siłowni. Pusta sala, 500 kr i jeden klient w drzwiach." />
    <meta property="og:url" content="https://iron-empire-ochre.vercel.app/" />
    <meta property="og:image" content="https://iron-empire-ochre.vercel.app/assets/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pl_PL" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GYMBARON" />
    <meta name="twitter:description" content="Symulator prowadzenia siłowni. Pusta sala, 500 kr i jeden klient w drzwiach." />
    <meta name="twitter:image" content="https://iron-empire-ochre.vercel.app/assets/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
